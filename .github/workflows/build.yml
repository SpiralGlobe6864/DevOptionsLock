name: Build DevOptionsLock

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate module scripts
        run: |
          sh -n module/ctl.sh
          sh -n module/service.sh
          sh -n module/uninstall.sh
          test -f module/module.prop

      - name: Package root module
        run: |
          rm -f DevOptionsLock-module.zip
          cd module
          zip -r ../DevOptionsLock-module.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevOptionsLock-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            DevOptionsLock-module.zip

      - name: Create GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/debug/app-debug.apk \
            DevOptionsLock-module.zip \
            --title "DevOptionsLock ${GITHUB_REF_NAME}" \
            --generate-notes
